name: tests

on:
  push:
    branches: [main]
  pull_request:

# Где идут задачи (22 ноября 2026). Закрытый репозиторий — на домашнем сервере владельца, исполнитель с меткой
# home-server под отдельным пользователем gh-runner: 3000 минут тарифа Pro кончились 21 ноября, своё железо минут не
# тратит. От дома хозяина gh-runner отделён только от случайного: он в группе docker, а демон работает от root, так что
# шаг задачи может прочитать любой файл сервера. Поэтому здесь идёт только код владельца — запросы из форков закрытого
# репозитория GitHub по умолчанию не запускает. Открытый снимок (publish-public.sh шлёт этот же файл) — на машинах GitHub: открытому
# репозиторию минуты бесплатны, а свой исполнитель там дал бы чужому запросу на слияние гнать код на сервере.
# Признак — приватность репозитория, а не его имя.
jobs:
  hooks:
    name: Hook tests (bash)
    # Версия закреплена (D1316): метка ubuntu-latest молча сменила образ на 26.04 с coreutils на Rust (uutils), а рецепт
    # замера Linux остался на GNU. Тот же образ — в scripts/measure-linux-parity.sh; их равенство сверяет
    # hooks/tests/test_measure_linux_parity.sh (T6).
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","home-server"]') || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # ИСТОРИЯ — ВХОД ПРИБОРОВ (19 сентября 2026). Без fetch-depth checkout берёт
          # глубину 1, а `scripts/docs-address-drift.py` строит ожидание из коммита,
          # которым менялся документ: при одном коммите ожидание равно нынешнему
          # содержимому У КАЖДОГО адреса. Замер того дня, одно дерево и две глубины:
          # 37e86ae при полной истории — «уплывших: 11, содержимое исчезло: 1»; то же
          # дерево с историей в один коммит — «уплывших: 0». Прибор теперь отвечает
          # кодом 2 «НЕ ИЗМЕРЕНО» вместо ложного нуля, и чтобы он мог мерить здесь,
          # раннеру нужна полная история.
          fetch-depth: 0
      - name: Run hook test suite (container ubuntu:26.04)
        # Набор идёт в свежем контейнере по рецепту scripts/measure-linux-parity.sh — одному на CI и на замер
        # `suite-linux`; jq и gitleaks ставит рецепт. Контейнер, а не сам исполнитель: на сервере набор не должен
        # оставлять следов между прогонами и видеть что-либо, кроме дерева checkout (оно едет в контейнер потоком, D1355).
        run: bash scripts/measure-linux-parity.sh

  mcp-server:
    name: MCP server tests (pytest)
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","home-server"]') || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # ИСТОРИЯ — ВХОД ПРИБОРОВ (19 сентября 2026). Без fetch-depth checkout берёт
          # глубину 1, а `scripts/docs-address-drift.py` строит ожидание из коммита,
          # которым менялся документ: при одном коммите ожидание равно нынешнему
          # содержимому У КАЖДОГО адреса. Замер того дня, одно дерево и две глубины:
          # 37e86ae при полной истории — «уплывших: 11, содержимое исчезло: 1»; то же
          # дерево с историей в один коммит — «уплывших: 0». Прибор теперь отвечает
          # кодом 2 «НЕ ИЗМЕРЕНО» вместо ложного нуля, и чтобы он мог мерить здесь,
          # раннеру нужна полная история.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        # Ставим по uv.lock, а не по переписанному руками списку пакетов. Список в этом файле
        # был копией dependencies из mcp-server/pyproject.toml и разошёлся с ней: там стояло
        # `mcp[cli]` без верхней границы, pip брал 2.0.0, где FastMCP вынесен из пакета, и
        # сборка тестов падала с ModuleNotFoundError. Локально та же связка держалась на
        # uv.lock и была зелёной — расхождение жило ровно между двумя списками зависимостей,
        # то есть проверка шла в другой рамке, чем работа (pattern-verification-frame-mismatch).
        # `--frozen` обязателен: он роняет прогон при расхождении lock и pyproject, вместо
        # того чтобы тихо разрешить зависимости заново и снова разъехаться с локальным.
        # fastembed тянет ~80MB модель — самый тяжёлый шаг; кэш uv его переиспользует.
        run: cd mcp-server && uv sync --frozen
      - name: Run pytest
        run: cd mcp-server && uv run --frozen python -m pytest -q
